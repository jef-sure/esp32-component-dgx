## IDF Component Manager Manifest File
version: "0.10.8"
description: "Display and graphics component for ESP32 with SPI, QSPI, I2C, parallel and MIPI-DSI display buses, virtual screens, drawing primitives, fonts, handwritten text and morphing"
url: https://github.com/jef-sure/esp32-component-dgx
repository: https://github.com/jef-sure/esp32-component-dgx.git
documentation: https://github.com/jef-sure/esp32-component-dgx/blob/main/README.md
issues: https://github.com/jef-sure/esp32-component-dgx/issues

dependencies:
  idf:
    version: ">=5.2.0"

tags:
  - display
  - graphics
  - lcd
  - oled
  - spi
  - qspi
  - i2c
  - mipi-dsi
  - framebuffer
  - font
  - bezier
  - handwriting
  - morphing

maintainers:
  - "Anton Petrusevich <anton.petrusevich.mobile@gmail.com>"

license: MIT

files:
  # A list of what goes into the archive, and nothing else does. The manager
  # starts from every file in the directory, tracked by git or not, takes away
  # what "exclude" says and adds back what "include" says, so "include" limits
  # nothing by itself and overrides "exclude". A file of a new kind stays out
  # of the archive silently until it is listed here.
  exclude:
    - "**/*"
  include:
    # a copy taken from the registry is checked by this list too: a file the
    # archive holds and the list misses fails the check of its hash
    - "idf_component.yml"
    - "CMakeLists.txt"
    - "project_include.cmake"
    - "Kconfig"
    - "README.md"
    - "CHANGES.md"
    - "LICENSE"
    - "src/**/*.c"
    - "src/**/*.h"
    - "include/**/*.h"
    - "src/fonts/README.md"
    # the fixes of the font editor for the faces of DGX's fonts, taken by the fonts made at build time
    - "src/fonts/*.patch.json"
    # the texts of the licenses that go with the fonts of DGX
    - "src/fonts/licenses/*.txt"
    - "font2c/*.c"
    - "font2c/*.py"
    - "font2c/README.md"
    - "font-editor/*.js"
    - "font-editor/*.css"
    - "font-editor/*.html"
    - "font-editor/README.md"
    # the platform-independent part built on a PC: dgx_host.mk and the stubs
    - "host/dgx_host.mk"
    - "host/stubs/**/*.h"
    # the window on the computer in place of the display of a board
    - "host/window/*.c"
    - "host/window/*.h"
    - "host/window/stubs/*.h"
    # the headers ESP-IDF lacks for its linux target, where the window is built too
    - "host/esp-idf/include/**/*.h"
    # by name: the directory also holds working notes, and the pictures of the
    # README, which are taken from GitHub
    - "docs/18-bit-pixels-??.md"
    - "docs/benchmarks-??.md"
    - "docs/dsi-display-??.md"
    - "docs/dsi-usage-??.md"
    - "docs/first-piece-??.md"
    - "docs/fonts-??.md"
    - "docs/handwriting-??.md"
    - "docs/hw-font-ru.md"
    - "docs/morphing-??.md"
    - "docs/nv3041a-??.md"
    - "docs/pen-??.md"
    # one level each, so that nothing comes from the build directories of the examples
    - "examples/*/CMakeLists.txt"
    # the build of an example for the window on the computer
    - "examples/*/Makefile"
    - "examples/*/README.md"
    - "examples/*/fonts.rules"
    - "examples/*/sdkconfig.defaults*"
    - "examples/*/*.py"
    - "examples/*/main/idf_component.yml"
    - "examples/*/main/Kconfig.projbuild"
    - "examples/*/main/*.c"
    - "examples/*/main/*.cpp"
    - "examples/*/main/*.h"
    - "examples/*/main/*.txt"
    - "test/fonts/Makefile"
    - "test/fonts/fonts.rules"
    - "test/fonts/keys.json"
    - "test/fonts/round_trip.js"
    - "test/fonts/strings.po"
    - "test/fonts/test_fonts.py"
    - "test/fonts/title.txt"
    - "test/host/Makefile"
    - "test/host/panel_streams.txt"
    - "test/host/*.c"
    - "test/host/*.h"
